# 範本，不含真實密鑰。實際部署請用下面其中一種方式建立 Secret，
# 不要把填好真實 token 的 yaml commit 進 git。
#
# 方式一（推薦，不落地檔案）：
#   kubectl create secret generic dc-ytmusic-lite-secret \
#     --from-literal=DISCORD_TOKEN=xxxxx \
#     --from-literal=DISCORD_CLIENT_ID=xxxxx
#
# 方式二：複製這個檔案為 secret.yaml（已在 .gitignore 排除），
# 填入真實值後 kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dc-ytmusic-lite-secret
type: Opaque
stringData:
  DISCORD_TOKEN: "REPLACE_ME"
  DISCORD_CLIENT_ID: "REPLACE_ME"
  # 正式環境留空或整行刪除，讓指令走 global registration
  # DISCORD_GUILD_ID: "REPLACE_ME"
